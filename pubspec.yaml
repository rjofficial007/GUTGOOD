name: gutgood
description: GutGood is a premium, AI-powered gut health companion built with Flutter and Firebase. It leverages OpenAI's GPT-4o-mini and GPT-4o models, alongside the Open Food Facts API, to provide real-time personalized food swaps, hybrid barcode/label scanning, and dynamic health insights.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.9
  flutter_animate: ^4.5.2
  lucide_icons_flutter: ^3.1.15
  shimmer: ^3.0.0

  # Navigation & Deep Linking
  go_router: ^17.3.0
  app_links: ^7.2.1

  # State Management & DI
  provider: ^6.1.5+1
  get_it: ^9.2.1
  equatable: ^2.1.0

  # Firebase Suite
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  firebase_remote_config: ^6.5.5
  cloud_functions: ^6.3.5
  firebase_analytics: ^12.4.5
  firebase_crashlytics: ^5.2.6

  # Authentication & Security
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7

  # Networking & HTTP
  dio: ^5.11.0
  http: ^1.6.0

  # Images & Media Handling
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.5.1
  image_picker: ^1.2.3

  # Hardware & Device Integration
  mobile_scanner: ^7.4.0
  permission_handler: ^12.0.3
  device_info_plus: 12.3.0
  package_info_plus: 9.0.1
  share_plus: 12.0.2
  url_launcher: ^6.3.2

  # Local Persistence
  shared_preferences: ^2.5.5

  # Notifications & Time
  flutter_local_notifications: ^22.2.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  intl: ^0.20.3

  # Monetization
  purchases_flutter: ^10.6.0

  # Content & Utilities
  flutter_markdown_plus: ^1.0.12
  in_app_review: ^2.0.12
  upgrader: ^13.6.0
  uuid: ^4.6.0
  logger: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

#  config:
#    enable-swift-package-manager: false

  assets:
    - assets/images/
    - assets/fonts/

