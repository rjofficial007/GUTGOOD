name: gutgood
description: GutGood is a premium, AI-powered gut health companion built with Flutter and Firebase. It leverages OpenAI's GPT-4o-mini and GPT-4o models, alongside the Open Food Facts API, to provide real-time personalized food swaps, hybrid barcode/label scanning, and dynamic health insights.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  flutter_animate: ^4.5.2
  lucide_icons_flutter: ^3.1.23
  shimmer: ^4.0.0

  # Navigation & Deep Linking
  go_router: ^18.0.2
  app_links: ^7.2.2

  # State Management & DI
  provider: ^6.1.5+1
  get_it: ^9.3.0
  equatable: ^3.0.0

  # Firebase Suite
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_remote_config: ^6.7.0
  cloud_functions: ^6.5.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0

  # Authentication & Security
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7

  # Networking & HTTP
  dio: ^5.11.1
  openfoodfacts: ^3.31.0

  # Images & Media Handling
  cached_network_image: ^4.0.4
  flutter_image_compress: ^2.5.1
  image_picker: ^1.2.4
  lottie: ^3.6.1

  # Hardware & Device Integration
  mobile_scanner: ^7.4.2
  permission_handler: ^13.0.2
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  url_launcher: ^6.3.3

  # Local Persistence
  shared_preferences: ^2.5.6

  # Notifications & Time
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.1
  timezone: ^0.11.1
  intl: ^0.20.3

  # Monetization
  purchases_flutter: ^10.15.2

  # Content & Utilities
  flutter_markdown_plus: ^1.0.12
  in_app_review: ^2.0.12
  upgrader: ^13.7.0
  uuid: ^4.6.0
  rxdart: ^0.28.0
  smooth_page_indicator: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  mocktail: ^1.0.5
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

#  config:
#    enable-swift-package-manager: false

  assets:
    - assets/images/
    - assets/animations/

  # Inter Tight drives the Insights bento design only (see
  # lib/features/insights/presentation/widgets/bento/insight_bento_theme.dart).
  # Static instances are instantiated from the upstream variable font
  # (google/fonts, ofl/intertight) so every weight resolves reliably.
  # Licensed under SIL OFL 1.1 — see assets/fonts/OFL.txt.
  fonts:
    - family: InterTight
      fonts:
        - asset: assets/fonts/InterTight-Light.ttf
          weight: 300
        - asset: assets/fonts/InterTight-Regular.ttf
          weight: 400
        - asset: assets/fonts/InterTight-Medium.ttf
          weight: 500
        - asset: assets/fonts/InterTight-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterTight-Bold.ttf
          weight: 700
        - asset: assets/fonts/InterTight-ExtraBold.ttf
          weight: 800

